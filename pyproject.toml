[project]
name = "uep-machinelearning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.1",
    "pandas>=3.0.0",
    "sentence-transformers>=5.2.0",
]

[dependency-groups]
dev = [
    "bandit>=1.8.3",
    "mypy>=1.15.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.8.0",
    "pytest>=8.3.5",
    "ruff>=0.9.10",
]

[tool.ruff]
line-length = 120
output-format = "full"

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
target-version = "py313"

[tool.ruff.lint]
select = [
    "A",
    "B",
    "C4",
    "E",
    "F",
    "I001",
    "SIM",
    "UP",
]
ignore = ["E501", "B008"]
unfixable = ["B"]

[tool.ruff.lint.flake8-builtins]
ignorelist = ["format"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false


[tool.pytest]
# Async support
asyncio_mode = "auto"

# Parallel testing configuration
addopts = [
    "--strict-config",
    "-n=auto",  # Enable parallel testing with auto worker count
    "--dist=worksteal",  # Use worksteal distribution for better load balancing
]

# xdist configuration for parallel testing
# These settings ensure proper isolation when running tests in parallel
xfail_strict = true

# Disable warnings about test collection to reduce noise in parallel runs
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# Test discovery
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
norecursedirs = [".git", ".env", "venv"]

# Test markers
markers = [
    "unit: Unit tests that test isolated components with mocked dependencies",
    "integration: Integration tests that test component interactions",
    "e2e: End-to-end tests that test full workflows (may require API key)",
]


[tool.mypy]
python_version = "3.13"
show_error_codes = true
strict = true
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false
ignore_missing_imports = true
disable_error_code = "abstract"



[tool.bandit]
exclude_dirs = ['tests/*']

[tool.coverage.paths]
source = ["pybdl/"]

[tool.coverage.run]
source = ["pybdl/"]
omit = [
    "**/__init__.py",
]
relative_files = true

[tool.coverage.report]
show_missing = true